# PR과 main 변경마다 규칙 검사(.work/check.py)와 테스트(uv run pytest)를 돌린다. 비밀값이 필요 없다.
# 원본: doomdiver100T/claude-github-setup 커밋 9c45959의 template/managed/common/.github/workflows/rules-check.yml을 복사해 고침 [Past work: setup]
# check.py는 테스트를 부르지 않으므로 테스트 작업(tests)을 따로 둔다. 두 결과가 PR에 따로 보인다 [Claude proposal]
# pr-check는 PR 본문의 '읽은 파일'·'최신 흐름 갱신' 칸을 본다(check.py --pr). 본문을 고치면 다시 돌도록 edited를 넣는다.
# edited에서도 세 작업을 모두 돌린다(작업을 건너뛰면 건너뜀이 앞 실패를 덮어 필수 검사를 통과한 것처럼 보인다) [Claude proposal]
name: rules-check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: rules-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 레포 규칙 검사
        run: python .work/check.py

  pr-check:
    name: pr-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # base와 비교(git diff base...HEAD)하려고 기록을 모두 가져온다
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: PR 본문 검사(읽은 파일·최신 흐름 갱신)
        run: python .work/check.py --pr

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 테스트 DB는 전부 PostgreSQL이다(3절). service 컨테이너를 띄워 TEST_DATABASE_URL로 쓴다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Python 버전은 .python-version(3.12)을 따른다
      - uses: astral-sh/setup-uv@v10.3.3

      - name: 패키지 설치
        run: uv sync --locked

      - name: 테스트
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  windows-worker:
    name: windows-worker
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      TEST_DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: 패키지 설치
        run: uv sync --locked

      - name: Windows 시험 PostgreSQL 시작
        shell: pwsh
        run: |
          $pgService = Get-Service -Name 'postgresql-x64-*' | Select-Object -First 1
          Set-Service -Name $pgService.Name -StartupType Manual
          Start-Service -Name $pgService.Name

      - name: Windows 개인 실행기·DPAPI·DACL·HTTPS 프로세스 검사
        run: uv run pytest tests/test_worker_credentials.py tests/test_worker_execution.py tests/test_worker_process.py -q
