{% macro button(label, disabled=true) -%}
<button class="button" type="button"{% if disabled %} disabled{% endif %}>{{ label }}</button>
{%- endmacro %}
{% macro link_button(label, href) -%}
<a class="button button-primary" href="{{ href }}">{{ label }}</a>
{%- endmacro %}
{% macro submit_button(label) -%}
<button class="button" type="submit">{{ label }}</button>
{%- endmacro %}
