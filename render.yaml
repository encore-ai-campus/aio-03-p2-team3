# 서버는 웹 서비스로, React 앱은 정적 사이트로 분리 배포한다(README 분리 배포 절).
services:
  - type: web
    name: aio3-gmail-quote
    runtime: python
    branch: main
    region: singapore
    plan: free
    buildCommand: uv sync --locked
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      # 공용 LLM 키. 채우면 모든 AI 호출이 이 키로 직접 실행되고, 비우면 각 사용자의 /settings 등록 키를 쓴다.
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      # 분리 배포는 프론트와 서버가 다른 사이트라 OAuth 연결 대기 상태 쿠키를 공유한다(HTTPS 전제).
      - key: SESSION_SAME_SITE
        value: "none"
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      # 정적 사이트는 루트 경로로 서비스하므로 콜백 복귀 기본 경로를 "/"로 둔다(비우면 기본값 /app).
      - key: FRONTEND_BASE_PATH
        value: "/"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      - key: PUBSUB_PUSH_AUDIENCE
        sync: false
      - key: PUBSUB_PUSH_SERVICE_ACCOUNT
        sync: false
      - key: PUBSUB_PUSH_TOKEN
        sync: false
  - type: web
    name: aio3-gmail-quote-ui
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build -- --base=/
    staticPublishPath: dist
    routes:
      # SPA 새로고침·상세 주소를 index.html로 복구한다.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # 서버 웹 서비스 주소(예: https://aio3-gmail-quote.onrender.com). 같은 출처 실행에서는 비운다.
      - key: VITE_API_BASE_URL
        sync: false
