[project]
name = "aio-03-p2-team3"
version = "0.1.0"
description = "단위 프로젝트2 팀3 — LangGraph 복합 API 연계 일정 조정 에이전트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 버전은 PyPI(`pip index versions <패키지>`)로 확인해 ==로 고정한다(기본 2026-11-05, 앱 뼈대 2026-11-09 확인).
# 더할 때는 `uv add <패키지>==<버전>`을 쓴다(.work/TASK.md 환경 줄).
dependencies = [
    "langgraph==1.2.20",
    "langchain-google-genai==4.4.3",
    "google-api-python-client==2.201.0",
    "google-auth==2.62.1",
    "google-auth-oauthlib==1.5.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "itsdangerous==2.2.0",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.8",
    "cryptography==50.0.2",
    "fpdf2==2.9.0",
]

[dependency-groups]
dev = [
    "pypdf==7.0.0",
    "pytest==9.2.0",
]

[tool.uv]
# 레포 루트에서 app을 불러오며 uv sync는 실행 환경만 만든다.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
